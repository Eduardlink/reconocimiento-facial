<!DOCTYPE html>
<html>
<head>
    <title>Registro</title>
</head>
<body>
    <h1>Registro de Usuario</h1>
    <form action="#">
        <label for="usuario">Usuario:</label><br>
        <input type="text" id="usuario" name="usuario"><br>
        <label for="contraseña">Contraseña:</label><br>
        <input type="password" id="contraseña" name="contraseña"><br>
        <label for="confirmar">Confirmar Contraseña:</label><br>
        <input type="password" id="confirmar" name="confirmar"><br>
        <button type="submit">Registrarse</button>
    </form>
    <button type="button" onclick="location.href='#'">Volver al Login</button>
</body>
</html>
